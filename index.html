<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高市政権 政治人物相関図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root { 
        width: 100%; 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        background-color: #f8fafc; 
      }
      /* D3 Specific Styles */
      .node text {
        font-family: sans-serif;
        pointer-events: none;
        text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, -1px 0 0 #fff;
        font-weight: 600;
        user-select: none;
      }
      .link {
        fill: none;
        stroke-opacity: 0.6;
        transition: stroke-opacity 0.3s;
      }
      .link-label-bg {
        fill: rgba(255, 255, 255, 0.8);
        stroke: none;
      }
      .link-label text {
        font-family: sans-serif;
        font-size: 10px;
        fill: #333;
        pointer-events: none;
        text-anchor: middle;
        dominant-baseline: central;
        user-select: none;
      }
      .cluster-box {
        fill-opacity: 0.1;
        stroke-opacity: 0.4;
        stroke-width: 1px;
        transition: all 0.3s ease-out;
        pointer-events: none;
      }
      /* Hover Effects */
      .dimmed {
        opacity: 0.1;
        transition: opacity 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
